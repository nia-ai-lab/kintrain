<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">KinTrain AWSアーキテクチャ</title>
  <desc id="desc">React SPA、Cognito、Core API、DynamoDB、S3、AgentCore Runtime、Memory、Gateway、REQUEST Interceptor、MCP Lambdaの現行構成</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #64748b; }
      .lane { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #334155; letter-spacing: 1px; }
      .cardTitle { font: 800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #0f172a; }
      .cardSub { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #475569; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #475569; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #64748b; }
      .edgeLabel { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .edge { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .edgeBlue { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .edgePurple { fill: none; stroke: #7c3aed; stroke-width: 2.4; marker-end: url(#arrowPurple); }
      .edgeGreen { fill: none; stroke: #15803d; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text x="54" y="58" class="title">KinTrain アプリケーション AWS アーキテクチャ</text>
  <text x="54" y="86" class="subtitle">実装基準: Amplify Gen 2 / React SPA / REST Lambda APIs / Amazon Bedrock AgentCore</text>
  <rect x="1662" y="38" width="204" height="36" rx="18" fill="#e2e8f0"/>
  <text x="1681" y="61" class="small">更新: 2026-07-29</text>

  <rect x="32" y="108" width="1856" height="908" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="9 7"/>
  <text x="56" y="138" class="lane">AWS CLOUD / BRANCH-SCOPED BACKEND</text>

  <rect x="48" y="162" width="1824" height="150" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="70" y="190" class="lane">CLIENT・HOSTING・AUTH</text>

  <rect x="74" y="208" width="222" height="78" rx="14" class="card"/>
  <circle cx="102" cy="236" r="15" fill="#475569"/>
  <path d="M86 269c3-18 29-18 32 0" fill="#475569"/>
  <text x="132" y="235" class="cardTitle">利用者</text>
  <text x="132" y="260" class="cardSub">Browser / mobile web</text>

  <rect x="360" y="198" width="274" height="98" rx="14" class="card"/>
  <rect x="360" y="198" width="8" height="98" rx="4" fill="#f59e0b"/>
  <text x="386" y="228" class="cardTitle">AWS Amplify Hosting</text>
  <text x="386" y="252" class="cardSub">React + Vite SPA / PWA manifest</text>
  <text x="386" y="275" class="small">amplify_outputs.json で接続設定</text>

  <rect x="704" y="188" width="366" height="118" rx="14" class="card"/>
  <rect x="704" y="188" width="8" height="118" rx="4" fill="#dd344c"/>
  <text x="730" y="217" class="cardTitle">Amazon Cognito User Pool</text>
  <text x="730" y="241" class="cardSub">access token + aws.cognito.signin.user.admin</text>
  <text x="730" y="264" class="small">SPA App Client / Managed Login domain</text>
  <text x="730" y="286" class="small">ChatGPT・Claude 専用 OAuth App Client</text>

  <rect x="1170" y="198" width="330" height="98" rx="14" class="card"/>
  <rect x="1170" y="198" width="8" height="98" rx="4" fill="#7c3aed"/>
  <text x="1196" y="228" class="cardTitle">外部 MCP クライアント</text>
  <text x="1196" y="252" class="cardSub">ChatGPT / Claude</text>
  <text x="1196" y="275" class="small">Authorization Code + Cognito OAuth</text>

  <rect x="1560" y="198" width="280" height="98" rx="14" class="card"/>
  <rect x="1560" y="198" width="8" height="98" rx="4" fill="#0f766e"/>
  <text x="1586" y="228" class="cardTitle">React SPA</text>
  <text x="1586" y="252" class="cardSub">Core API / Runtime client</text>
  <text x="1586" y="275" class="small">private S3へpresigned POST</text>

  <path d="M296 247 L360 247" class="edge"/>
  <text x="307" y="232" class="edgeLabel">HTTPS</text>
  <path d="M634 247 L704 247" class="edge"/>
  <text x="646" y="232" class="edgeLabel">sign in</text>
  <path d="M296 272 C520 330 1320 330 1560 272" class="edge dashed"/>
  <text x="888" y="322" class="edgeLabel">load SPA</text>
  <path d="M1170 247 L1070 247" class="edge"/>
  <text x="1085" y="232" class="edgeLabel">OAuth</text>

  <rect x="48" y="334" width="1824" height="300" rx="18" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="70" y="364" class="lane">CORE DATA PATH</text>

  <rect x="112" y="408" width="280" height="150" rx="14" class="card"/>
  <rect x="112" y="408" width="8" height="150" rx="4" fill="#2563eb"/>
  <text x="140" y="440" class="cardTitle">Core REST API</text>
  <text x="140" y="465" class="cardSub">Amazon API Gateway RestApi</text>
  <text x="140" y="489" class="small">Cognito authorizer + scope</text>
  <text x="140" y="513" class="small">明示 route / CORS error responses</text>
  <text x="140" y="537" class="tiny">profile・menu・plan・history・daily・AI設定</text>

  <rect x="480" y="388" width="610" height="206" rx="14" class="card"/>
  <rect x="480" y="388" width="8" height="206" rx="4" fill="#f97316"/>
  <text x="510" y="420" class="cardTitle">Application Lambda APIs（TypeScript）</text>
  <text x="510" y="451" class="small">profile-api　　training-menu-api　　training-history-api</text>
  <text x="510" y="478" class="small">daily-record-api　　ai-settings-api　　avatar-upload-api</text>
  <text x="510" y="505" class="small">coaching-context-api</text>
  <line x1="510" y1="524" x2="1056" y2="524" stroke="#e2e8f0"/>
  <text x="510" y="549" class="tiny">日別計画・セット固有処方 / 回復状態・痛み・食事メモ</text>
  <text x="510" y="572" class="tiny">アバター署名URL / コーチング方針・短期メモ・版履歴</text>

  <rect x="1180" y="372" width="650" height="242" rx="14" class="card"/>
  <rect x="1180" y="372" width="8" height="242" rx="4" fill="#0f766e"/>
  <text x="1210" y="405" class="cardTitle">Data stores &amp; signing secret</text>
  <text x="1210" y="434" class="cardSub">Amazon DynamoDB（PAY_PER_REQUEST / PITR / userId partition）</text>
  <text x="1210" y="462" class="small">UserProfile　TrainingMenu　TrainingMenuSet　TrainingMenuSetItem</text>
  <text x="1210" y="488" class="small">DailyTrainingPlan　TrainingHistory　TrainingPerformance</text>
  <text x="1210" y="514" class="small">DailyRecord　Goal　AiSetting　CoachingContext（TTL）</text>
  <line x1="1210" y1="532" x2="1800" y2="532" stroke="#e2e8f0"/>
  <text x="1210" y="557" class="cardSub">Amazon S3: private AvatarImageBucket</text>
  <text x="1210" y="580" class="small">Secrets Manager: pagination token signing key</text>

  <path d="M185 286 C185 344 252 350 252 408" class="edgeBlue"/>
  <text x="196" y="348" class="edgeLabel">REST + access token</text>
  <path d="M392 483 L480 483" class="edgeBlue"/>
  <text x="406" y="466" class="edgeLabel">route</text>
  <path d="M1090 483 L1180 483" class="edgeGreen"/>
  <text x="1108" y="466" class="edgeLabel">read / write</text>
  <path d="M1560 278 C1510 315 1480 335 1470 372" class="edgeGreen dashed"/>
  <text x="1490" y="342" class="edgeLabel">avatar upload</text>

  <rect x="48" y="656" width="1824" height="336" rx="18" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="70" y="686" class="lane">AI COACH・MCP PATH（ENABLE_AGENTCORE_RESOURCES=true の場合）</text>

  <rect x="112" y="736" width="302" height="188" rx="14" class="card"/>
  <rect x="112" y="736" width="8" height="188" rx="4" fill="#7c3aed"/>
  <text x="140" y="768" class="cardTitle">AgentCore Runtime</text>
  <text x="140" y="793" class="cardSub">Python 3.12 / Strands / SSE</text>
  <text x="140" y="819" class="small">Cognito JWT inbound authorizer</text>
  <text x="140" y="843" class="small">SOUL + PERSONA + system prompt</text>
  <text x="140" y="867" class="small">Bearer tokenをGatewayへ中継</text>
  <text x="140" y="891" class="tiny">通常チャット / AIメニュー生成</text>

  <rect x="500" y="716" width="284" height="96" rx="14" class="card"/>
  <rect x="500" y="716" width="8" height="96" rx="4" fill="#a855f7"/>
  <text x="528" y="748" class="cardTitle">Amazon Bedrock</text>
  <text x="528" y="773" class="cardSub">MODEL_ID / response stream</text>
  <text x="528" y="795" class="tiny">既定: global.anthropic.claude-sonnet-5</text>

  <rect x="500" y="842" width="284" height="108" rx="14" class="card"/>
  <rect x="500" y="842" width="8" height="108" rx="4" fill="#8b5cf6"/>
  <text x="528" y="874" class="cardTitle">AgentCore Memory</text>
  <text x="528" y="899" class="cardSub">90日 / actorId・sessionId</text>
  <text x="528" y="923" class="tiny">preference / summary / semantic facts</text>

  <rect x="874" y="716" width="286" height="122" rx="14" class="card"/>
  <rect x="874" y="716" width="8" height="122" rx="4" fill="#7c3aed"/>
  <text x="902" y="748" class="cardTitle">AgentCore Gateway</text>
  <text x="902" y="773" class="cardSub">MCP / Cognito scope</text>
  <text x="902" y="797" class="small">Runtime・ChatGPT・Claudeから接続</text>
  <text x="902" y="820" class="tiny">Lambda target: kintrain-core-tools</text>

  <rect x="874" y="862" width="286" height="96" rx="14" class="card"/>
  <rect x="874" y="862" width="8" height="96" rx="4" fill="#dc2626"/>
  <text x="902" y="894" class="cardTitle">REQUEST Interceptor</text>
  <text x="902" y="919" class="cardSub">access tokenを独立再検証</text>
  <text x="902" y="942" class="tiny">verified sub → __principalUserId</text>

  <rect x="1254" y="750" width="292" height="176" rx="14" class="card"/>
  <rect x="1254" y="750" width="8" height="176" rx="4" fill="#f97316"/>
  <text x="1282" y="782" class="cardTitle">mcp-tools-api</text>
  <text x="1282" y="807" class="cardSub">24 tools / Lambda target</text>
  <text x="1282" y="833" class="small">分析export・履歴・Daily・目標</text>
  <text x="1282" y="857" class="small">回復状態・食事・コーチング方針</text>
  <text x="1282" y="881" class="small">一時メニュー作成・更新・取消</text>
  <text x="1282" y="905" class="tiny">許可フィールドだけを応答</text>

  <rect x="1630" y="750" width="198" height="176" rx="14" class="card"/>
  <rect x="1630" y="750" width="8" height="176" rx="4" fill="#0f766e"/>
  <text x="1658" y="782" class="cardTitle">DynamoDB</text>
  <text x="1658" y="808" class="cardSub">本人のpartitionのみ</text>
  <text x="1658" y="836" class="small">履歴 / Daily</text>
  <text x="1658" y="860" class="small">メニュー / 日別計画</text>
  <text x="1658" y="884" class="small">Goal / AI設定</text>
  <text x="1658" y="908" class="small">CoachingContext</text>

  <path d="M112 272 C70 430 70 756 112 790" class="edgePurple"/>
  <text x="76" y="704" class="edgeLabel">InvokeAgentRuntime + SSE</text>
  <path d="M414 775 L500 764" class="edgePurple"/>
  <text x="430" y="750" class="edgeLabel">model</text>
  <path d="M414 880 L500 896" class="edgePurple"/>
  <text x="430" y="908" class="edgeLabel">memory</text>
  <path d="M414 830 C640 830 700 777 874 777" class="edgePurple"/>
  <text x="635" y="811" class="edgeLabel">MCP + relayed JWT</text>
  <path d="M1335 296 C1280 326 1125 314 1125 372 L1125 664 C1125 690 1080 700 1030 716" class="edgePurple"/>
  <text x="1085" y="650" class="edgeLabel">direct MCP</text>
  <path d="M1017 838 L1017 862" class="edge"/>
  <text x="1028" y="854" class="edgeLabel">request</text>
  <path d="M1160 910 C1210 910 1210 838 1254 838" class="edge"/>
  <text x="1178" y="890" class="edgeLabel">verified identity</text>
  <path d="M1546 838 L1630 838" class="edgeGreen"/>
  <text x="1555" y="821" class="edgeLabel">read / write</text>

  <rect x="72" y="952" width="770" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="88" y="970" class="tiny">実線: runtime data flow　　破線: direct / delivery flow　　全データストアはブランチ名でdev/mainを分離</text>
  <text x="884" y="974" class="tiny">Source of truth: amplify/backend.ts, frontend/src/api/*, amplify/functions/*, amplify/agentcore/*</text>
</svg>
